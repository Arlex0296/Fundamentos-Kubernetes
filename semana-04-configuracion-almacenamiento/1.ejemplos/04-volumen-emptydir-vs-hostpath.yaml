# ⏳ Lab 4: Almacenamiento Efímero (emptyDir) vs Persistente en Nodo (hostPath)
# Analogía KubeCafé: Bandeja temporal en la barra (emptyDir) vs estante en la mesa actual (hostPath).
apiVersion: v1
kind: Pod
metadata:
  name: pod-almacenamiento-local
spec:
  containers:
    - name: escritor
      image: busybox:1.36
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      command:
        - sh
        - -c
        - |
          echo "[emptyDir] $(date) | nodo: $NODE_NAME" >> /tmp-bandeja/pedidos.log
          echo "[hostPath] $(date) | nodo: $NODE_NAME" >> /nodo-estante/historial.log
          echo "=== Contenido de /tmp-bandeja/pedidos.log (emptyDir) ==="
          cat /tmp-bandeja/pedidos.log
          echo "=== Contenido de /nodo-estante/historial.log (hostPath) ==="
          cat /nodo-estante/historial.log
          sleep 3600
      volumeMounts:
        - name: bandeja-efimera
          mountPath: /tmp-bandeja
        - name: estante-nodo
          mountPath: /nodo-estante
  volumes:
    - name: bandeja-efimera
      emptyDir: {}
    - name: estante-nodo
      hostPath:
        path: /tmp/kubecafe-nodo-estante
        type: DirectoryOrCreate
