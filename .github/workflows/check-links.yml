name: 🔗 Validar Enlaces Internos en Markdown

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/check-links.yml"
    paths-ignore:
      - "aportes-comunidad/soluciones-retos/**"
  pull_request:
    paths:
      - "**/*.md"
    paths-ignore:
      - "aportes-comunidad/soluciones-retos/**"

permissions:
  contents: read

jobs:
  check-links:
    name: Verificar enlaces locales en archivos Markdown
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔗 Ejecutar lychee (enlaces internos y rutas locales)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path 'aportes-comunidad/soluciones-retos' "**/*.md"
          fail: true
