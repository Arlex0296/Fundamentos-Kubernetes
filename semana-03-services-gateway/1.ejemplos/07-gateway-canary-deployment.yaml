apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu-gw
      version: v1
  template:
    metadata:
      labels:
        app: menu-gw
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              echo "☕ Menu v1.0 (Estable - 80%) | Pod: $HOSTNAME" > /usr/share/nginx/html/index.html
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: menu-v1-svc
spec:
  type: ClusterIP
  selector:
    app: menu-gw
    version: v1
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-v2-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu-gw
      version: v2
  template:
    metadata:
      labels:
        app: menu-gw
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              echo "🚀 Menu v2.0 (Canary - 20%) | Pod: $HOSTNAME" > /usr/share/nginx/html/index.html
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: menu-v2-svc
spec:
  type: ClusterIP
  selector:
    app: menu-gw
    version: v2
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: menu-canary-route
spec:
  parentRefs:
    - name: kubecafe-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /canary
      backendRefs:
        - name: menu-v1-svc
          port: 80
          weight: 80
        - name: menu-v2-svc
          port: 80
          weight: 20
