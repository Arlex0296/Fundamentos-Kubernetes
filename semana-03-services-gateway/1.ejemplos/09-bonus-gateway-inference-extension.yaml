# 🌟 Bonus Lab: Gateway API Inference Extension (InferencePool + InferenceModel)
# Requiere instalar los CRDs de Gateway API Inference Extension:
# kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/latest/download/manifests.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-cpu-pool
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ollama-cpu
  template:
    metadata:
      labels:
        app: ollama-cpu
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferencePool
metadata:
  name: kubecafe-llm-pool
spec:
  targetPortNumber: 11434
  selector:
    app: ollama-cpu
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceModel
metadata:
  name: barista-rapido
spec:
  modelName: qwen2.5:0.5b
  criticality: Critical
  poolRef:
    name: kubecafe-llm-pool
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubecafe-inference-route
spec:
  parentRefs:
    - name: kubecafe-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - group: inference.networking.x-k8s.io
          kind: InferencePool
          name: kubecafe-llm-pool
