apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "iximiuz-pool"
spec:
  blocks:
    - start: "172.16.0.200"
      stop: "172.16.0.240"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: "iximiuz-l2-policy"
spec:
  interfaces:
    - ^eth0$
  externalIPs: true
  loadBalancerIPs: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecafe-lb-app
  labels:
    app: kubecafe-lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubecafe-lb
  template:
    metadata:
      labels:
        app: kubecafe-lb
    spec:
      containers:
        - name: web
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              echo "⚖️☕ KubeCafe LoadBalancer (Cilium L2) | Pod: $HOSTNAME" > /usr/share/nginx/html/index.html
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: kubecafe-lb-svc
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: kubecafe-lb
  ports:
    - name: http
      port: 80
      targetPort: 80
