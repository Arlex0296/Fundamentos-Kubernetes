# ==============================================================================
# EJEMPLO 02: Service NodePort (Exposición Externa Directa por Puerto del Nodo)
# Analogía: Ventanilla directa en la fachada de KubeCafé (puerto 30080).
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecafe-menu-web
  labels:
    app: kubecafe-menu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubecafe-menu
  template:
    metadata:
      labels:
        app: kubecafe-menu
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: menu-nodeport-svc
spec:
  type: NodePort
  selector:
    app: kubecafe-menu
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      # Rango válido en Kubernetes: 30000 - 32767
      nodePort: 30080
