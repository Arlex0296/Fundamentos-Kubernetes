apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  labels:
    app: api-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      containers:
        - name: api
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              mkdir -p /usr/share/nginx/html
              echo "{\"cafeteria\":\"KubeCafe\",\"backend_pod\":\"$HOSTNAME\"}" > /usr/share/nginx/html/api
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-backend-svc
spec:
  type: ClusterIP
  selector:
    app: api-backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-frontend-conf
data:
  default.conf: |
    server {
      listen 80;
      location / {
        return 200 "Frontend NodePort (:30090) -> prueba /api\n";
      }
      location /api {
        proxy_pass http://api-backend-svc.default.svc.cluster.local;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  labels:
    app: web-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-frontend-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend-svc
spec:
  type: NodePort
  selector:
    app: web-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30090
